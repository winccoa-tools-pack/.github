name: "🐞 Bug report"
description: Report a bug in any repository of the WinCC OA Tools Pack
title: "[Bug]: "
labels: ["triage", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. This is the central place for all repositories of the organization, so please tell us where the problem is.
        Before submitting, please review the triage process:
        https://github.com/winccoa-tools-pack/.github/blob/main/docs/triage-guide.md

  - type: input
    id: repository
    attributes:
      label: Repository or tool
      description: Which repository, package or extension is affected?
      placeholder: "Example: npm-winccoa-core or vscode-winccoa-logviewer"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: In the best case a small script or project that reproduces the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Version of the affected package or extension, WinCC OA version, Node.js and operating system.
      placeholder: "Example: 2.0.8, WinCC OA 3.21, Node.js 22, Windows 11"

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output. Please remove passwords and tokens.
      render: shell
