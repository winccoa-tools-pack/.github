##
# Reusable: Limited test coverage notice
#
# The WinCC OA integration tests are not run in CI (no working Docker setup yet,
# see the tracking issue). This job makes the reduced scope visible without ever
# failing the pipeline:
#   - a workflow warning annotation
#   - a job summary
#   - one sticky comment on the pull request (updated, never duplicated)
#
# Caller (ci-cd.yml):
#   limited-tests-notice:
#     needs: [test]
#     if: ${{ needs.test.result == 'success' }}
#     permissions:
#       contents: read
#       pull-requests: write
#     uses: winccoa-tools-pack/.github/.github/workflows/reusable-limited-tests-notice.yml@main
#     with:
#       integration_command: npm run test:integration
##

name: "Reusable: Limited test coverage notice"

on:
  workflow_call:
    inputs:
      integration_command:
        description: "Command the PR author runs locally to execute the integration tests. Empty = not mentioned"
        type: string
        default: "npm run test:integration"
      comment:
        description: "Post or update one comment on the pull request"
        type: boolean
        default: true

permissions: {}

jobs:
  notice:
    name: Integration tests are manual
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Warn and summarize
        shell: bash
        env:
          CMD: ${{ inputs.integration_command }}
        run: |
          set -euo pipefail
          PLAIN="CI ran lint, format and unit tests only. The WinCC OA integration tests are not run in CI."
          MD="CI ran **lint, format and unit tests only**. The WinCC OA integration tests are **not run in CI**."
          if [ -n "$CMD" ]; then
            PLAIN="$PLAIN Run them locally ($CMD) before merging when the change can affect them."
            MD="$MD Run them locally (\`$CMD\`) before merging when the change can affect them."
          fi
          echo "::warning title=Limited test coverage::$PLAIN"
          {
            echo "## ⚠️ Limited test coverage"
            echo ""
            echo "$MD"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sticky PR comment
        # Dependabot tokens are read-only, fork PRs cannot write, upmerge PRs need no reminder.
        if: ${{ inputs.comment && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.head.ref, 'feature/upmerge-') }}
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          CMD: ${{ inputs.integration_command }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- ci:limited-tests-notice -->';
            const cmd = process.env.CMD || '';
            const lines = [
              marker,
              '### ⚠️ Limited test coverage',
              '',
              'CI ran **lint, format and unit tests only**. The WinCC OA integration tests are **not run in CI** (no working Docker setup yet).',
            ];
            if (cmd) {
              lines.push('', `Please run them locally before merging when this change can affect them: \`${cmd}\``);
            }
            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body?.includes(marker));
            if (!existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            } else if (existing.body !== body) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }
